{n:"Pengantar",src:"Finlayson (2012) 'Rhetoric and the Political Theory of Ideologies'; Sartori (1969) 'Politics, Ideology, and Belief Systems'; Freeden (2006) 'Ideology and Political Theory' & (2008) 'Thinking Politically and Thinking Ideologically'",
def:[["Freeden (2006): ideologi = kata bermasalah","Awalnya berarti studi/ilmu tentang ide, kini justru menunjuk satu area saja dari domain yang dikajinya. Freeden berargumen ideologi adalah bentuk paling tipikal dari pemikiran politik, sehingga mengkajinya membawa teoretikus ke jantung 'yang politis'."],
["Sartori (1969): 'black box'","Ideologi adalah cluster concept. Dua ranah: ideologi dalam pengetahuan (vs kebenaran/sains) dan ideologi dalam politik (nilai fungsional). Dibedakan ideological mentality (ideologism) vs pragmatisme — keduanya sama-sama keadaan berkeyakinan, jadi 'keyakinan' bukan unsur pembeda."],
["Finlayson (2012): teori politik tentang ideologi","Sub-bidang yang mempelajari ide politik 'in the wild' (pidato, pamflet, poster, demonstrasi), bukan hanya kanon filsafat. Ideologi dilihat sebagai properti politik, bukan malfungsi; ambiguitas penting untuk mobilisasi dukungan (Freeden)."],
["Freeden (2008): berpikir politis vs ideologis","Thinking ideologically = pola pandangan tentang isu substantif (demokrasi, kemiskinan, perang) dan perebutan makna bahasa. Ideologi adalah struktur temporal yang menyuntikkan harapan/kecemasan pada visi masa depan."]],
tok:[["Marx & Engels","Ideologi sebagai ilusi/'upside-down' yang terlepas dari kehidupan nyata; hilang bila dominasi kelas berakhir (dikutip Freeden 2006)."],["Althusser & Stuart Hall","Althusser: ideologi 'bukan aberasi' tapi struktur esensial masyarakat. Hall: kerangka mental (bahasa, konsep, kategori) untuk memahami diri & masyarakat."],["Michael Freeden","Analisis morfologis: objek studi = konsep (concept). Ambiguitas bukan tipu daya."],["Ernesto Laclau","Analisis diskursus: objek = penanda (signifier); ideologi bagian dari struktur semua pengalaman."],["Alan Finlayson","Menambah objek ketiga: argumen politik (political argument) lewat tradisi retorika."],["Giovanni Sartori","Membedakan doktrin ideologis vs mentalitas ideologis."]],
var:[["Pendekatan morfologis (Freeden)","Concept → konfigurasi konsep inti & periferal."],["Analisis diskursus (Laclau)","Signifier → hegemoni, artikulasi."],["Pendekatan retoris (Finlayson)","Argument → logos, ethos, pathos dalam persuasi politik."],["Ideologi sbg totalitarian seduction","Sistem ide berbasis 'satu kebenaran' (khas abad ke-20)."]],
kri:[["Plato & filsafat politik","Hanya filsafat yang dianggap sah bicara benar tentang polis; retorika dicurigai. Freeden: banyak filsafat politik menunjukkan 'flight from the political'."],["Daniel Bell","Ideologi sebagai 'trap', ideolog = 'terrible simplifiers' (dikutip Freeden)."],["Sartori","Popularitas istilah ideologi diimbangi kekaburannya; perlu penanda teknis yang punya daya jelaskan."],["Rational choice","Mengganti pemikiran politik dengan kalkulasi keputusan rasional (Finlayson)."]],
rel:[["Ideologi 'sehari-hari'","Kajian ideologi memakai pidato, kolom koran, situs web, poster, demonstrasi sebagai data (Finlayson)."],["Liberalisme sebagai meta-kategori","Bell: setelah Perang Dunia II 'liberalisme' diperluas jadi ideologi konstitutif 'Barat' lewat perang melawan totalitarianisme."]],
ist:[["Doxa vs Episteme","Opini politik sehari-hari vs pengetahuan filosofis."],["Morphology","Struktur susunan konsep dalam ideologi."],["Ideologism vs Pragmatism","Dua mentalitas, keduanya keadaan berkeyakinan."],["Belief system","Kelas umum; ideologi lebih sempit (Sartori)."],["Hegemony","Kekuasaan lewat persetujuan (Laclau, Gramsci)."],["Weltanschauung","Pandangan dunia."]]},

{n:"Liberalisme",src:"Harrison & Boyd (2003) Bab 10 'Liberalism'; Duncan Bell 'What is Liberalism?'; bacaan primer: J.S. Mill 'On Liberty', Keynes 'The End of Laissez-Faire', Spencer 'The Man Versus the State'",
def:[["Harrison & Boyd","Ideologi dominan awal milenium ketiga; berakar di akhir abad ke-17. Tema: individu & hak, pandangan optimis tentang manusia, kemajuan, kebebasan, pemerintahan terbatas, ekonomi pasar, internasionalisme."],["Duncan Bell","'What is liberalism?' tak punya inti tunggal: Shklar (syarat kebebasan personal), Waldron (semua aspek sosial dapat diterima setiap individu), Dworkin (kesetaraan). Bell: liberalisme = jumlah argumen yang diklasifikasikan liberal oleh sesama liberal sepanjang waktu."],["Prinsip inti Mill","Kekuasaan atas individu hanya sah untuk mencegah bahaya bagi orang lain; individu berdaulat atas tubuh & pikirannya (harm principle)."]],
tok:[["John Locke","Two Treatises (1690): kontrak sosial, persetujuan yang diperintah, hak properti, hak memberontak; Letter Concerning Toleration (1689)."],["Voltaire, Montesquieu, Adam Smith","Dianggap leluhur liberal oleh liberal abad ke-19."],["J.S. Mill","On Liberty (1859): kebebasan berpikir/berbicara, toleransi."],["T.H. Green","Kebebasan positif: kolektif perlu menghapus hambatan (miskin, sakit, bodoh)."],["Hobhouse & Hobson","New Liberalism: kerja sama > kompetisi; kritik konsentrasi kekayaan."],["Beveridge & Keynes","Arsitek welfare state & manajemen permintaan pasca-1945."],["Herbert Spencer","Pembela laissez-faire, 'survival of the fittest', menentang intervensi negara."]],

kri:[["Harrison & Boyd","Pasar tak otomatis menghasilkan keadilan sosial; gagal tuntas soal kejahatan, kemiskinan, terorisme, kerusakan lingkungan; kebebasan bisa jadi 'licence'; pandangan manusia optimis digugat neo-Darwinisme."],["Bell","Terlalu meluas ('all-purpose word'); narasi 'jatuh/naik' (Strauss, Wolin, Mises) bersifat politis."],["Mereka yang merasa tersisih","Liberal klasik jadi ideologi kaum kuat yang mampu memakai kebebasan (pembelaan New Liberals)."]],
rel:[["Kasus Rushdie 1988","Fatwa vs kebebasan berbicara: dilema toleransi."],["Kosovo 1998","Intervensi 'humanitarian' atau imperialisme?"],["Pasca-1991","Klaim liberalisme tak punya saingan, lalu kehilangan keyakinan."],["Human Rights Act (2000)","Hak dikonstitusikan."]],
ist:[["Laissez-faire","Negara tak campur ekonomi."],["Harm principle","Batas kebebasan = bahaya bagi orang lain."],["Social contract","Otoritas dari persetujuan."],["Pluralism","Keragaman opini & kelompok; negara = wasit."],["Positive vs negative freedom","Kemampuan nyata vs bebas dari paksaan."],["Glorious Revolution 1688","Monarki dibatasi Parlemen."]],
tl:[["1688–90","Glorious Revolution; Locke Two Treatises"],["1776","Declaration of Independence (kontrak sosial)"],["1859","Mill, On Liberty"],["1909","People's Budget (New Liberalism)"],["1942–44","Beveridge & Keynes: welfare state"],["1991","Runtuhnya Soviet; klaim kemenangan liberal"]]},

{n:"Sosialisme",src:"Bab 4 'Sosialisme' (buku Ideologi Politik, edisi Indonesia; hasil OCR, halaman 166–232)",

tok:[["Fourier & Robert Owen","Sosialis utopia: Fourier ('phalanstery', ±1.800 anggota), Owen (New Harmony, Indiana, 1824–29; pelopor koperasi)."],["Marx & Engels","Teori sejarah, revolusi penggulingan kapitalisme, komunisme tanpa kelas; 'dari masing-masing sesuai kemampuan…sesuai kebutuhan'."],["Lenin & Stalin","Bolshevik 1917; Stalin: 'Sosialisme di Satu Negara', nasionalisasi 1930-an."],["Gramsci","Hegemoni borjuis: dominasi lewat supremasi ideologis, bukan hanya ekonomi."],["Kropotkin, Tawney, Nyerere","Mutual aid; kritik 'kesetaraan kesempatan' (filsafat berudu); 'sosialisme kesukuan' Afrika."]],

kri:[["Runtuhnya komunisme 1989–91","Memicu klaim 'matinya sosialisme'."],["Merosotnya politik kelas","Deindustrialisasi menyusutkan kelas pekerja tradisional."],["Partai sosialis mengadopsi liberal/konservatif","Nasionalisasi komprehensif ditinggalkan."],["Lyotard (1984)","Marxisme sebagai teori sejarah/grand narrative dipersoalkan."],["Praktik Soviet","Kolektif 'mandiri' nyatanya dikontrol bos partai."]],

{n:"Konservatisme",src:"Ian Adams, Ideologi Politik Mutakhir (edisi Indonesia), bab 'Konservatisme dan Sayap Kanan' (OCR, hlm. 170–191)",

kri:[["Kritik konservatif pada liberalisme","Kebebasan liberal egois; individu terisolasi & rentan eksploitasi."],["Kritik pada konservatisme","Konservatisme baru anti-demokrasi, rasis, membenarkan perang/kolonialisme lewat Darwinisme sosial."],["Polarisasi","Di Perancis ide tak bisa masuk banyak partai sehingga politik lebih sengit."]],

{n:"Global South",src:"Dados & Connell 'The Global South'; Tickner (2016); Benabdallah dkk. 'Global South Perspectives'; Carrozza & Benabdallah (2022); Nair (2017) 'Introducing Postcolonialism in IR'; Acharya (2016) 'Studying the Bandung Conference'",
